# runtz self-hosted stack (published images).
#
#   docker compose up -d
#
# No secrets to set: sessions, API keys and login codes are issued and stored
# by the engine. Copy .env.example to .env only to change ports or add OAuth.
#
# To build from source instead, add the dev override:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
services:
  mongodb:
    image: mongo:7
    container_name: runtz-mongodb
    restart: unless-stopped
    # Deliberately not published to the host: the database holds every session
    # and scan, and only the backend needs to reach it over the compose network.
    # For a one-off shell use `docker compose exec mongodb mongosh`.
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: runtzdev/runtz-engine:${RUNTZ_VERSION:-1.0.0-rc18}
    container_name: runtz
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      PORT: ${PORT:-8080}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-runtz}
      RUNTZ_DEPLOYMENT_MODE: ${RUNTZ_DEPLOYMENT_MODE:-self-hosted}
      RUNTZ_PUBLIC_URL: ${RUNTZ_PUBLIC_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-Runtz <login@runtz.dev>}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_PRO_CLOUD: ${STRIPE_PRICE_PRO_CLOUD:-}
      STRIPE_PRICE_ENTERPRISE_CLOUD: ${STRIPE_PRICE_ENTERPRISE_CLOUD:-}
      STRIPE_PRICE_PRO_SELF_HOSTED: ${STRIPE_PRICE_PRO_SELF_HOSTED:-}
      STRIPE_PRICE_ENTERPRISE_SELF_HOSTED: ${STRIPE_PRICE_ENTERPRISE_SELF_HOSTED:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    image: runtzdev/runtz-frontend:${RUNTZ_VERSION:-1.0.0-rc18}
    container_name: runtz-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
      RUNTZ_BACKEND_URL: ${RUNTZ_BACKEND_URL:-http://backend:8080}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  mongodb-data:
