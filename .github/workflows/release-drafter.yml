---
name: Release Drafter

on:
  push:
    branches:
      - dev
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    branches:
      - dev

permissions:
  contents: read

jobs:
  update_release_draft:
    permissions:
      contents: write
      pull-requests: write
    runs-on:
      - runtz-runners
    steps:
      - uses: release-drafter/release-drafter@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
