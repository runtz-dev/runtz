# Copy this file next to your environment values (see helm/environments/) as
# values.secrets.yaml and fill the real values locally.
# Keep values.secrets.yaml out of git — it is ignored by git and by Helm packaging.
#
# Required (the engine refuses to start with empty or placeholder values):
#   jwtSecret    generate with: openssl rand -base64 32
#   ingestToken  generate with: openssl rand -base64 24
backend:
  secrets:
    jwtSecret: ""
    ingestToken: ""
    resendApiKey: ""
    githubClientSecret: ""
    stripeSecretKey: ""
    stripeWebhookSecret: ""
    # Base64 Ed25519 seed or private key used by the central/cloud engine to sign
    # self-hosted licenses. Generate with: openssl rand -base64 32
    licensePrivateKey: ""
