# runtz production environment (cloud engine at runtz.dev).
#
# Non-secret overrides on top of helm/runtz/values.yaml. Secrets come from the
# pre-created Kubernetes Secret runtz-engine-secrets (see helm/environments/
# README.md and the secrets-helm repo), never from a local file.
#
# Deployed by the prod pipeline (.github/workflows/runtz-pipeline-prod-k8s.yml)
# on release publish. The engine image is the generic multi-arch Docker Hub
# image; the frontend is the cloud variant (NEXT_PUBLIC_* baked at build time)
# pushed to the in-cluster registry. Image tags are injected with --set:
#
#   helm upgrade --install runtz runtz/runtz \
#     -f helm/environments/prod/values.yaml \
#     --set backend.image.tag="<version>" \
#     --set frontend.image.tag="<version>"

frontend:
  image:
    # Cloud build: NEXT_PUBLIC_GOOGLE_CLIENT_ID baked in, pushed to the in-cluster registry.
    repository: registry.local:5000/runtz-frontend-cloud
    tag: ""
    pullPolicy: Always
  env:
    NEXT_PUBLIC_API_URL: ""
    NEXT_PUBLIC_GOOGLE_CLIENT_ID: "724575650478-rvqpmrlvqljr50e111rvj1f96n43pp5s.apps.googleusercontent.com"
    # Frontend server-side proxy target.
    RUNTZ_BACKEND_URL: "https://engine.runtz.dev"

backend:
  image:
    # Generic public engine image (no build-time config).
    repository: runtzdev/runtz-engine
    tag: ""
    pullPolicy: Always
  env:
    RUNTZ_DEPLOYMENT_MODE: cloud
    RUNTZ_PUBLIC_URL: https://runtz.dev
    GOOGLE_CLIENT_ID: "724575650478-rvqpmrlvqljr50e111rvj1f96n43pp5s.apps.googleusercontent.com"
    GITHUB_CLIENT_ID: "Ov23lighOXCekIlR3Q4H"
    CORS_ALLOWED_ORIGINS: https://runtz.dev
    # Stripe Price IDs are non-secret config (price_... ids from the Stripe
    # dashboard). The Stripe secret key and webhook secret live in the
    # runtz-engine-secrets Secret.
    STRIPE_PRICE_PRO_CLOUD: "price_1Tkt89JJ8Z2MDrZtx1K5X4GQ"
    STRIPE_PRICE_ENTERPRISE_CLOUD: "price_1Tkt8AJJ8Z2MDrZtFtvD4wRi"
    STRIPE_PRICE_PRO_SELF_HOSTED: "price_1Tkt8BJJ8Z2MDrZtws3fzzAZ"
    STRIPE_PRICE_ENTERPRISE_SELF_HOSTED: "price_1Tkt8CJJ8Z2MDrZtG423eXWq"
  secrets:
    existingSecret: runtz-engine-secrets
  ingress:
    enabled: true
    className: "cloudflare-tunnel"
    hosts:
      - host: engine.runtz.dev
        paths:
          - path: /
            pathType: Prefix

mongodb:
  persistence:
    storageClassName: openebs-ssd

ingress:
  enabled: true
  className: "cloudflare-tunnel"
  hosts:
    - host: runtz.dev
      paths:
        - path: /home/_next
          pathType: Prefix
          serviceName: runtz-landing
          servicePort: 3000
        - path: /home
          pathType: Prefix
          serviceName: runtz-landing
          servicePort: 3000
        # Legal pages (terms/privacy) live in the landing app; its proxy
        # rewrites /legal/* to the /home basePath internally.
        - path: /legal
          pathType: Prefix
          serviceName: runtz-landing
          servicePort: 3000
        - path: /login
          pathType: Prefix
        - path: /app
          pathType: Prefix
        - path: /api
          pathType: Prefix
        - path: /playground
          pathType: Prefix
        - path: /_next
          pathType: Prefix
        - path: /
          pathType: Prefix
