{{- if .Values.backend.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "runtz.backendConfigMapName" . }}
  labels:
    {{- include "runtz.componentLabels" (dict "root" . "component" "backend") | nindent 4 }}
data:
  PORT: {{ .Values.backend.env.PORT | quote }}
  MONGODB_URI: {{ default (printf "mongodb://%s:%v" (include "runtz.mongodbName" .) .Values.mongodb.service.port) .Values.backend.env.MONGODB_URI | quote }}
  MONGODB_DATABASE: {{ .Values.backend.env.MONGODB_DATABASE | quote }}
  RUNTZ_DEPLOYMENT_MODE: {{ .Values.backend.env.RUNTZ_DEPLOYMENT_MODE | quote }}
  RUNTZ_PUBLIC_URL: {{ .Values.backend.env.RUNTZ_PUBLIC_URL | quote }}
  RESEND_FROM_EMAIL: {{ .Values.backend.env.RESEND_FROM_EMAIL | quote }}
  CORS_ALLOWED_ORIGINS: {{ .Values.backend.env.CORS_ALLOWED_ORIGINS | quote }}
  {{- /*
    OAuth client ids and Stripe price ids are deployment-specific and, on our
    own cloud, come from the pre-created ConfigMap in backend.existingConfigMap
    (which is layered after this one). They are rendered here only when set, so
    an empty value from values.yaml never shadows the external one.
  */}}
  {{- range $key := list "GOOGLE_CLIENT_ID" "GITHUB_CLIENT_ID" "STRIPE_PRICE_PRO_CLOUD" "STRIPE_PRICE_ENTERPRISE_CLOUD" "STRIPE_PRICE_PRO_SELF_HOSTED" "STRIPE_PRICE_ENTERPRISE_SELF_HOSTED" }}
  {{- with get $.Values.backend.env $key }}
  {{ $key }}: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- /*
    OpenTelemetry. Rendered only when an endpoint is configured: the engine
    treats an unset OTEL_EXPORTER_OTLP_ENDPOINT as "telemetry off", so a
    self-hosted install gets no exporter and no keys it has to reason about.
  */}}
  {{- range $key := list "OTEL_EXPORTER_OTLP_ENDPOINT" "OTEL_RESOURCE_ATTRIBUTES" }}
  {{- with get $.Values.backend.env $key }}
  {{ $key }}: {{ . | quote }}
  {{- end }}
  {{- end }}
{{- end }}
