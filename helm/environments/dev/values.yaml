# runtz development environment (the runtz team's own staging).
#
# Mirrors prod (cloud mode) but on the internal registry and the
# runtz-dev/engine-dev/mcp-dev.runtz.dev hostnames. Images are built and pushed by the dev pipeline
# (.github/workflows/runtz-pipeline-dev-k8s.yml); the image tags are injected
# at deploy time with --set, so they are intentionally left empty here.
#
# Non-secret overrides on top of helm/runtz/values.yaml. Secrets come from the
# pre-created Kubernetes Secret runtz-engine-secrets (see helm/environments/
# README.md and the secrets-helm repo), never from a local file.
#
#   helm upgrade --install runtz ./helm/runtz \
#     -f helm/environments/dev/values.yaml \
#     --set backend.image.tag="dev<sha>" \
#     --set frontend.image.tag="dev<sha>"

frontend:
  image:
    # Built by the dev pipeline and pushed to the in-cluster registry. No
    # NEXT_PUBLIC_* config is baked in: the engine serves it at runtime.
    repository: registry.local:5000/runtz-frontend
    tag: ""
    pullPolicy: Always
  env:
    NEXT_PUBLIC_API_URL: ""
    # Left empty on purpose: the browser gets the Google client id at runtime
    # from the engine (/api/v1/setup/status), which reads it from the
    # runtz-engine-config ConfigMap. Nothing environment-specific is baked in.
    NEXT_PUBLIC_GOOGLE_CLIENT_ID: ""
    RUNTZ_BACKEND_URL: "https://engine-dev.runtz.dev"
    # Traces and metrics go to the in-cluster SigNoz collector. ClusterIP only,
    # so this is the FQDN — the short name would not resolve from the dev
    # namespace.
    OTEL_EXPORTER_OTLP_ENDPOINT: "http://signoz-otel-collector.signoz.svc.cluster.local:4318"
    OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=dev,service.namespace=runtz"

backend:
  image:
    repository: registry.local:5000/runtz-engine
    tag: ""
    pullPolicy: Always
  env:
    RUNTZ_DEPLOYMENT_MODE: cloud
    RUNTZ_PUBLIC_URL: https://runtz-dev.runtz.dev
    CORS_ALLOWED_ORIGINS: https://runtz-dev.runtz.dev
    OTEL_EXPORTER_OTLP_ENDPOINT: "http://signoz-otel-collector.signoz.svc.cluster.local:4318"
    OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=dev,service.namespace=runtz"
    # GOOGLE_CLIENT_ID, GITHUB_CLIENT_ID and the four STRIPE_PRICE_* ids are
    # deployment config for our cloud only — they come from the
    # runtz-engine-config ConfigMap below (secrets-helm/configmaps-dev.yaml),
    # never from this repository. Dev is wired to the Stripe SANDBOX.
  # Non-secret cloud config, applied to the cluster out of band.
  existingConfigMap: runtz-engine-config
  secrets:
    existingSecret: runtz-engine-secrets
  # The engine ingress (engine-dev.runtz.dev) lives in secrets-helm/ingress-dev.yaml.
  ingress:
    enabled: false

mongodb:
  persistence:
    storageClassName: openebs-ssd-wd
    # openebs-ssd-wd is OpenEBS LocalPV (hostpath, BasePath /data/ssd-wd): the
    # volume is a directory on the node disk with no quota, so this number is
    # nominal — MongoDB can already grow into the whole 938G disk. The
    # StorageClass has allowVolumeExpansion unset and volumeClaimTemplates are
    # immutable, so changing it fails the upgrade with "updates to statefulset
    # spec ... are forbidden" and the only way to make it match is recreating
    # the volume. Keep it at the provisioned value — see
    # helm/environments/README.md.
    size: 20Gi

# Routing is NOT part of this release. The hostnames and the cloudflare-tunnel
# ingress class are specific to our cluster, so the Ingress objects live in the
# private secrets-helm folder (ingress-dev.yaml) and are applied with kubectl.
# The chart ships generic ingress support that stays disabled here.
ingress:
  enabled: false
