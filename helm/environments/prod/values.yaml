# runtz production environment (cloud engine at runtz.dev).
#
# Non-secret overrides on top of helm/runtz/values.yaml. Secrets come from the
# pre-created Kubernetes Secret runtz-engine-secrets (see helm/environments/
# README.md and the secrets-helm repo), never from a local file.
#
# Deployed by the prod pipeline (.github/workflows/runtz-pipeline-prod-k8s.yml)
# on release publish. The engine image is the generic multi-arch Docker Hub
# image; the frontend is the cloud variant (NEXT_PUBLIC_* baked at build time)
# pushed to the in-cluster registry. Image tags are injected with --set:
#
#   helm upgrade --install runtz runtz/runtz \
#     -f helm/environments/prod/values.yaml \
#     --set backend.image.tag="<version>" \
#     --set frontend.image.tag="<version>"

frontend:
  image:
    # Cloud build pushed to the in-cluster registry. It no longer bakes any
    # NEXT_PUBLIC_* config — everything environment-specific is served by the
    # engine at runtime.
    repository: registry.local:5000/runtz-frontend-cloud
    tag: ""
    pullPolicy: Always
  env:
    NEXT_PUBLIC_API_URL: ""
    # Left empty on purpose: the browser gets the Google client id at runtime
    # from the engine (/api/v1/setup/status), which reads it from the
    # runtz-engine-config ConfigMap. Nothing environment-specific is baked in.
    NEXT_PUBLIC_GOOGLE_CLIENT_ID: ""
    # Frontend server-side proxy target.
    RUNTZ_BACKEND_URL: "https://engine.runtz.dev"

backend:
  image:
    # Generic public engine image (no build-time config).
    repository: runtzdev/runtz-engine
    tag: ""
    pullPolicy: Always
  env:
    RUNTZ_DEPLOYMENT_MODE: cloud
    RUNTZ_PUBLIC_URL: https://runtz.dev
    CORS_ALLOWED_ORIGINS: https://runtz.dev
    # GOOGLE_CLIENT_ID, GITHUB_CLIENT_ID and the four STRIPE_PRICE_* ids are
    # deployment config for our cloud only — they come from the
    # runtz-engine-config ConfigMap below (secrets-helm/configmaps-prod.yaml),
    # never from this repository. Prod is wired to Stripe LIVE mode.
  # Non-secret cloud config, applied to the cluster out of band.
  existingConfigMap: runtz-engine-config
  secrets:
    existingSecret: runtz-engine-secrets
  # The engine ingress (engine.runtz.dev) lives in secrets-helm/ingress-prod.yaml.
  ingress:
    enabled: false

mongodb:
  persistence:
    storageClassName: openebs-ssd
    # openebs-ssd is OpenEBS LocalPV (hostpath): the volume is a directory on the
    # node disk with no quota, so this number is nominal — MongoDB can already
    # grow into the whole 938G disk. The StorageClass has allowVolumeExpansion
    # unset and volumeClaimTemplates are immutable, so changing it fails the
    # upgrade with "updates to statefulset spec ... are forbidden" and the only
    # way to make it match is recreating the volume. Keep it at the provisioned
    # value — see helm/environments/README.md.
    size: 10Gi

# Routing is NOT part of this release. The hostnames and the cloudflare-tunnel
# ingress class are specific to our cluster, so the Ingress objects live in the
# private secrets-helm folder (ingress-prod.yaml) and are applied with kubectl.
# The chart ships generic ingress support that stays disabled here.
ingress:
  enabled: false
