# runtz self-hosted stack (published images).
#
#   docker compose up -d
#
# Images default to :rc — the newest published build (release candidate or
# stable), so `docker compose pull && docker compose up -d` is the whole
# upgrade path. Pin a specific version instead by setting RUNTZ_VERSION in
# .env, e.g. RUNTZ_VERSION=1.0.0-rc26.
#
# No secrets to set: sessions, API keys and login codes are issued and stored
# by the engine. Copy .env.example to .env only to change ports; access is
# granted by username + admin-issued invite link, so there's nothing else to
# configure to get a working install.
#
# To build from source instead, add the dev override:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
services:
  mongodb:
    image: mongo:7
    container_name: runtz-mongodb
    restart: unless-stopped
    # Deliberately not published to the host: the database holds every session
    # and scan, and only the backend needs to reach it over the compose network.
    # For a one-off shell use `docker compose exec mongodb mongosh`.
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: runtzdev/runtz-engine:${RUNTZ_VERSION:-rc}
    container_name: runtz
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      PORT: ${PORT:-8080}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-runtz}
      RUNTZ_PUBLIC_URL: ${RUNTZ_PUBLIC_URL:-http://localhost:3000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    image: runtzdev/runtz-frontend:${RUNTZ_VERSION:-rc}
    container_name: runtz-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
      RUNTZ_BACKEND_URL: ${RUNTZ_BACKEND_URL:-http://backend:8080}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  mongodb-data:
