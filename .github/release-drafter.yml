name-template: '$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
# We're on v1.0.0-rc.N until 1.0.0 ships; every real release so far is a
# GitHub prerelease, and the /releases/latest API (which release-drafter
# uses to find "the previous release") ignores prereleases entirely. Without
# this the draft always resets to v0.1.0 with an empty changelog instead of
# picking up from the last rc. Version numbers are still set by hand when
# publishing (existing tags are "rcN"-style, not "rc.N", so auto-bumping
# would compute a regression below the last rc) — this only fixes changelog
# continuity.
include-pre-releases: true
categories:
  - title: 'Features'
    labels:
      - 'feature'
      - 'enhancement'
  - title: 'Bug Fixes'
    labels:
      - 'fix'
      - 'bugfix'
      - 'bug'
  - title: 'Security'
    labels:
      - 'security'
  - title: 'Maintenance'
    labels:
      - 'chore'
      - 'dependencies'
      - 'docs'
version-resolver:
  major:
    labels:
      - 'major'
  minor:
    labels:
      - 'minor'
      - 'feature'
  patch:
    labels:
      - 'patch'
      - 'bugfix'
      - 'fix'
  default: patch
template: |
  ## What's Changed

  $CHANGES

  **Full Changelog**: https://github.com/runtz-dev/runtz/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
